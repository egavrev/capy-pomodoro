name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug + release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: capy-pomodoro-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      # Also keep the latest APKs on the `builds` branch so they can be fetched with plain git
      # (and downloaded straight from GitHub on a phone).
      - name: Publish APKs to the builds branch
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/out
          cp build/outputs/apk/release/*-release.apk /tmp/out/capy-pomodoro.apk
          cp build/outputs/apk/debug/*-debug.apk /tmp/out/capy-pomodoro-debug.apk
          cd /tmp/out
          printf 'Built from %s on %s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "APK for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: app/build/reports/

  screenshots:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch APK
        run: |
          git fetch --depth 1 origin builds
          git show origin/builds:capy-pomodoro.apk > app.apk
          ls -la app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the UI tour on an Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install -r app.apk && OUT=shots bash tools/ui_tour.sh

      - name: Publish screenshots to the screenshots branch
        if: always()
        run: |
          mkdir -p shots && cd shots
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "UI tour for $GITHUB_SHA" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
