<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capy Pomodoro – Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B8456A}a:hover{color:#8E2F50}
</style>
</helmet>
<div style="width: 390px; height: 1500px; box-sizing: border-box; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 16px; font-family: Nunito, sans-serif; color: #4A2C36; background-color: #FFF5F8; background-image: radial-gradient(#F7C9D6 1.6px, transparent 1.8px); background-size: 20px 20px">

  <div style="display: flex; align-items: center; gap: 12px; height: 48px">
    <a href="Main.dc.html" aria-label="Back to timer" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #B8456A; box-shadow: 0 2px 8px rgba(184,69,106,0.12)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 26px; color: #4A2C36">Settings</h1>
    <svg width="48" height="32" viewBox="0 0 64 42" aria-hidden="true"><path d="M30 22 L21 39 L27 37 L30 41 L33 24 Z" fill="#F7B3C4" stroke="#C9506F" stroke-width="1.6" stroke-linejoin="round"></path><path d="M34 22 L43 39 L37 37 L34 41 L31 24 Z" fill="#F7B3C4" stroke="#C9506F" stroke-width="1.6" stroke-linejoin="round"></path><path d="M32 20 C22 5 5 3 5 16 C5 29 22 31 32 20 Z" fill="#F7B3C4" stroke="#C9506F" stroke-width="1.6"></path><path d="M32 20 C42 5 59 3 59 16 C59 29 42 31 32 20 Z" fill="#F7B3C4" stroke="#C9506F" stroke-width="1.6"></path><path d="M28 19 C21 13 14 12 11 15" fill="none" stroke="#C9506F" stroke-width="1.3" stroke-linecap="round"></path><path d="M36 19 C43 13 50 12 53 15" fill="none" stroke="#C9506F" stroke-width="1.3" stroke-linecap="round"></path><rect x="27" y="14" width="10" height="12" rx="4" fill="#F29BB3" stroke="#C9506F" stroke-width="1.6"></rect></svg>
  </div>

  <section style="background: #FFFFFF; border-radius: 26px; padding: 18px 18px 10px; box-shadow: 0 2px 12px rgba(184,69,106,0.10); display: flex; flex-direction: column">
    <h2 style="margin: 0 0 6px; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 19px; color: #B8456A">Timer</h2>
    <sc-for list="{{steppers}}" as="s" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 60px; border-bottom: 1px solid #FBE3EA">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-weight: 800; font-size: 15px">{{s.label}}</span>
          <span style="font-size: 12px; font-weight: 600; color: #7E5A66">{{s.hint}}</span>
        </div>
        <button onClick="{{s.dec}}" aria-label="{{s.decLabel}}" style="width: 44px; height: 44px; border: none; border-radius: 16px; background: #FFF0F4; color: #B8456A; font-size: 22px; font-weight: 800; cursor: pointer; font-family: Nunito, sans-serif">−</button>
        <span style="width: 64px; text-align: center; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 18px">{{s.display}}</span>
        <button onClick="{{s.inc}}" aria-label="{{s.incLabel}}" style="width: 44px; height: 44px; border: none; border-radius: 16px; background: #FFF0F4; color: #B8456A; font-size: 22px; font-weight: 800; cursor: pointer; font-family: Nunito, sans-serif">+</button>
      </div>
    </sc-for>
    <sc-for list="{{toggles}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 60px; border-bottom: {{g.border}}">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-weight: 800; font-size: 15px">{{g.label}}</span>
          <span style="font-size: 12px; font-weight: 600; color: #7E5A66">{{g.hint}}</span>
        </div>
        <button role="switch" aria-checked="{{g.checked}}" aria-label="{{g.label}}" onClick="{{g.flip}}" style="width: 60px; height: 44px; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <span style="width: 52px; height: 30px; border-radius: 15px; background: {{g.track}}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: {{g.justify}}">
            <span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(74,44,54,0.25)"></span>
          </span>
        </button>
      </div>
    </sc-for>
  </section>

  <section style="background: #FFFFFF; border-radius: 26px; padding: 18px; box-shadow: 0 2px 12px rgba(184,69,106,0.10); display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 19px; color: #B8456A">Background</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{backgrounds}}" as="b" hint-placeholder-count="4">
        <button aria-pressed="{{b.pressed}}" onClick="{{b.pick}}" style="position: relative; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; flex-direction: column; gap: 6px; font-family: Nunito, sans-serif; text-align: left">
          <span style="display: block; width: 100%; height: 96px; box-sizing: border-box; border-radius: 18px; border: {{b.border}}; background-color: {{b.color}}; background-image: {{b.image}}; background-size: {{b.size}}; background-position: center; overflow: hidden">
            <sc-if value="{{b.photo}}" hint-placeholder-val="{{ false }}">
              <img src="{{b.photoSrc}}" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 40% 45%; display: block">
            </sc-if>
          </span>
          <span style="font-weight: 800; font-size: 13px; color: #4A2C36; padding-left: 4px">{{b.label}}</span>
          <sc-if value="{{b.selected}}" hint-placeholder-val="{{ false }}">
            <svg width="42" height="28" viewBox="0 0 64 42" aria-hidden="true" style="position: absolute; right: -6px; top: -10px"><path d="M30 22 L21 39 L27 37 L30 41 L33 24 Z" fill="#F7B3C4" stroke="#C9506F" stroke-width="1.6" stroke-linejoin="round"></path><path d="M34 22 L43 39 L37 37 L34 41 L31 24 Z" fill="#F7B3C4" stroke="#C9506F" stroke-width="1.6" stroke-linejoin="round"></path><path d="M32 20 C22 5 5 3 5 16 C5 29 22 31 32 20 Z" fill="#F7B3C4" stroke="#C9506F" stroke-width="1.6"></path><path d="M32 20 C42 5 59 3 59 16 C59 29 42 31 32 20 Z" fill="#F7B3C4" stroke="#C9506F" stroke-width="1.6"></path><rect x="27" y="14" width="10" height="12" rx="4" fill="#F29BB3" stroke="#C9506F" stroke-width="1.6"></rect></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </section>

  <section style="background: #FFFFFF; border-radius: 26px; padding: 18px; box-shadow: 0 2px 12px rgba(184,69,106,0.10); display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 19px; color: #B8456A">Music</h2>
    <sc-for list="{{musicGroups}}" as="m" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-weight: 800; font-size: 14px; color: #4A2C36; display: flex; align-items: center; gap: 6px">
          <img src="{{m.thumb}}" alt="" style="width: 28px; height: 28px; border-radius: 14px; object-fit: cover; object-position: {{m.thumbPos}}">
          {{m.title}}
        </span>
        <div role="radiogroup" aria-label="{{m.title}}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{m.options}}" as="o" hint-placeholder-count="4">
            <button role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="min-height: 48px; border: none; border-radius: 16px; padding: 0 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: Nunito, sans-serif; font-weight: 800; font-size: 13px; text-align: left; background: {{o.bg}}; color: {{o.fg}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
              {{o.label}}
            </button>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 6px">
      <label for="vol" style="display: flex; justify-content: space-between; font-weight: 800; font-size: 14px">
        <span>Volume</span>
        <span style="color: #B8456A">{{volume}}%</span>
      </label>
      <input id="vol" type="range" min="0" max="100" value="{{volume}}" onChange="{{setVolume}}" style="width: 100%; height: 44px; margin: 0; accent-color: #B8456A">
    </div>
  </section>

  <button onClick="{{save}}" style="margin-top: auto; height: 56px; border: none; border-radius: 28px; background: #B8456A; color: #FFFFFF; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 18px; cursor: pointer; box-shadow: 0 8px 20px rgba(184,69,106,0.28)">{{saveLabel}}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { focus: 25, short: 5, long: 15, rounds: 4, autoBreak: true, chime: true, bg: 'dots', focusMusic: 'rain', breakMusic: 'birds', volume: 60, saved: false };
  }
  renderVals() {
    const s = this.state;
    const set = (k, v) => this.setState({ [k]: v, saved: false });
    const step = (key, label, hint, unit, min, max, by) => ({
      label, hint,
      display: s[key] + ' ' + unit,
      decLabel: 'Decrease ' + label,
      incLabel: 'Increase ' + label,
      dec: () => set(key, Math.max(min, s[key] - by)),
      inc: () => set(key, Math.min(max, s[key] + by))
    });
    const tog = (key, label, hint, last) => ({
      label, hint,
      checked: s[key] ? 'true' : 'false',
      track: s[key] ? '#B8456A' : '#E9D3DA',
      justify: s[key] ? 'flex-end' : 'flex-start',
      border: last ? 'none' : '1px solid #FBE3EA',
      flip: () => set(key, !s[key])
    });
    const relax = '../assets/images/capy_relax.png';
    const study = '../assets/images/capy_study.png';
    const bgDefs = [
      { id: 'dots', label: 'Blush dots', color: '#FFF5F8', image: 'radial-gradient(#F2A9BD 2px, transparent 2.2px)', size: '16px 16px' },
      { id: 'gingham', label: 'Pink gingham', color: '#FFFFFF', image: 'linear-gradient(90deg, rgba(242,155,179,0.35) 50%, transparent 50%), linear-gradient(rgba(242,155,179,0.35) 50%, transparent 50%)', size: '22px 22px' },
      { id: 'cream', label: 'Plain cream', color: '#FFF8F3', image: 'none', size: 'auto' },
      { id: 'room', label: 'Cozy capy room', color: '#FCE1E9', image: 'none', size: 'auto', photo: true, photoSrc: relax }
    ];
    const backgrounds = bgDefs.map((b) => ({
      ...b,
      selected: s.bg === b.id,
      pressed: s.bg === b.id ? 'true' : 'false',
      border: s.bg === b.id ? '3px solid #B8456A' : '1px solid #F3D3DD',
      pick: () => set('bg', b.id)
    }));
    const opts = (key, list) => list.map((o) => ({
      label: o.label,
      checked: s[key] === o.id ? 'true' : 'false',
      bg: s[key] === o.id ? '#B8456A' : '#FFF0F4',
      fg: s[key] === o.id ? '#FFFFFF' : '#4A2C36',
      pick: () => set(key, o.id)
    }));
    return {
      steppers: [
        step('focus', 'Focus', 'Study time per round', 'min', 5, 90, 5),
        step('short', 'Short break', 'After each focus round', 'min', 1, 30, 1),
        step('long', 'Long break', 'After all rounds', 'min', 5, 60, 5),
        step('rounds', 'Rounds', 'Before a long break', '', 1, 10, 1)
      ],
      toggles: [
        tog('autoBreak', 'Auto-start next phase', 'No tap needed between phases', false),
        tog('chime', 'Chime when a phase ends', 'A soft bell, even when muted', true)
      ],
      backgrounds,
      musicGroups: [
        { title: 'During focus', thumb: study, thumbPos: '45% 28%', options: opts('focusMusic', [
          { id: 'rain', label: 'Lo-fi rain' }, { id: 'piano', label: 'Soft piano' },
          { id: 'cafe', label: 'Café murmur' }, { id: 'none', label: 'No music' }
        ]) },
        { title: 'During breaks', thumb: relax, thumbPos: '40% 35%', options: opts('breakMusic', [
          { id: 'birds', label: 'Birdsong & piano' }, { id: 'ocean', label: 'Ocean waves' },
          { id: 'musicbox', label: 'Music box' }, { id: 'none', label: 'No music' }
        ]) }
      ],
      volume: s.volume,
      setVolume: (e) => set('volume', Number(e.target.value)),
      saveLabel: s.saved ? 'Saved' : 'Save settings',
      save: () => this.setState({ saved: true })
    };
  }
}
</script>
</body>
</html>
